server:
  port: 8082
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/session_db
    username: postgres
    password: 2005@Kalyansai

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: my-super-secret-key-12345678901234567890

management:
  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    hostname: session-service
    prefer-ip-address: true
